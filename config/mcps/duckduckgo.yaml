id: duckduckgo
enabled: true
endpoint: http://mcp-tools:8000/mcp
transport: streamable-http
category_hint: internet
description: Search the public internet and retrieve search results.
runtime:
  mode: direct
  port: 8000
  command:
    - duckduckgo-mcp-server
    - --transport
    - streamable-http
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --allowed-hosts
    - localhost:*
    - 127.0.0.1:*
    - mcp-tools:8000
